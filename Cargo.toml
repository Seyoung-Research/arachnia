[package]
name = "arachnia"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "arachnia"
description = "CRISPick-style gRNA designer for Cas9 (RuleSet3) and Cpf1 (SeqDeepCpf1), with Cas-OFFinder-style off-target search"
license = "MIT"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rayon = "1"
seqfold = { git = "https://github.com/Lattice-Automation/seqfold", tag = "v0.10.2", default-features = false }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
